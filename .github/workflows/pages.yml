name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Ubuntu's package mirrors sometimes answer 503; try again before giving up.
      - name: Install Chrome for the browser tests
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "install failed (attempt $i), retrying in 30 s"; sleep 30
          done
          exit 1
      - run: npm run build
      - name: Built page is committed and up to date
        run: git diff --exit-code site/app/index.html site/index.html site/app/bricks/viewer.js site/app/lang/ && test -z "$(git status --porcelain site/app/lang/)"
      - run: npm test
        env:
          NO_SANDBOX: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Optional: the app is hosted on Netlify (netlify.toml). To also publish to GitHub Pages, enable
  # Pages with "GitHub Actions" as the source and set the repository variable DEPLOY_PAGES to true.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
