# Netlify serves the prebuilt site in site/: the landing page at / and the app at /app/.
# CI checks that both pages match src/, so no build step runs here.
# Settings in this file override those in the Netlify UI.
[build]
  publish = "site"
  command = ""

# Browsers only install the app with a correctly typed manifest.
[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Always fetch the newest service worker, so updates reach installed apps.
# (The old one at /sw.js is gone on purpose: browsers then unregister it.)
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Brick shapes for the building-guide viewer: gzip data that the page unpacks itself.
[[headers]]
  for = "/app/ldraw/*.pack"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
